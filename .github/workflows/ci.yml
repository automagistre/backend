name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/e2e?schema=public
      # Заглушки обязательных при старте AppModule переменных
      JWT_SECRET: ci
      HOME_ASSISTANT_URL: http://127.0.0.1:1
      HOME_ASSISTANT_TOKEN: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (не блокирует, пока не разобран долг)
        continue-on-error: true
        run: npx eslint "{src,test}/**/*.ts"

      - name: Unit tests
        run: npm test

      - name: Migrations
        run: npx prisma migrate deploy

      - name: E2E (изоляция тенантов)
        run: npm run test:e2e

  # PR — только сборка; push в main — сборка и публикация в Harbor
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ${{ vars.HARBOR_REGISTRY || 'harbor.automagistre.ru' }}/automagistre/backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY || 'harbor.automagistre.ru' }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
